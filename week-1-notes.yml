# What is a distribution? What is Ubuntu?

Linux is like a engine(kernel) and Ubuntu(distro) is its implementation like car(OS) 
Ubuntu is a popular, free, and open-source Linux distribution OS

# What is WSL- Windows Subsystem for Linux?
Its compatibility layer developed by Microsoft allowing users to run a GNU/Linux environment, including command-line tools, utilities, and applications, directly on Windows without a separate virtual machine or dual-boot. 

