# ----------------------- Part 2: Permissions & Ownership -------------------------

ls -l  # will show you the access and permission

[ - ]     : file (d = directory, l = symlink)
[ rwx ]   : Owner's permissions
[ r-x ]   : Group’s permissions
[ r-- ]   : Others' permissions

r- read(4), w- write(2), x- execute(1)

So hit ls -l and got 

# -rwxrwxrwx 1 root root 36 Jul 20 11:02 dummy-file.txt

| Field            | Meaning                     |
| ---------------- | --------------------------- |
| `-rwxrwxrwx`     | File type & permissions     |
| `1`              | Hard link count             |
| `root`           | Owner (user) of the file    |
| `root`           | Group of the file           |
| `36`             | File size (in bytes)        |
| `Jul 20 11:02`   | Last modified date and time |
| `dummy-file.txt` | File name                   |


# chmod -> change permission for this file 
chmod u+x file.sh   # Add execute permission to user
chmod g-w file.sh   # Remove write from group
chmod o=r file.sh   # Set others to read-only

chmod 744 dummy-file.txt # Only owner can rwx while other can read only
ls -l

# chown -> change ownership for file
sudo chown akash:akash file.txt   # Change file owner and group
sudo chown root:root script.sh    # Give file to root

# sudo -> Execute as root
Use sudo for admin-level commands:-

sudo apt update
sudo systemctl restart nginx
sudo rm -rf /var/log/*

Note -> only users added in sudoers file can exec this sude cmd, if the user is not listed
the sudo cmd wont be execute
Not every one is permitted for sudo action command it is asked you pw in every 15 mnt 

sudo -l  # It will list the commands you’re allowed to run as sudo.






# ========================= Part 3: Process Management ==================

In Linux, every running command, service, or app is a process. The OS treats them like individual workers, each with a unique ID: the PID (Process ID).
 
 1. See What's Running –> ps, top, htop 

ps # process snapshot
ps aux ->  
a: Show processes for all users
u: Show user
x: Include background processes

top  # Live Process Monitor
Shows live CPU & memory usage
Sorted by resource consumption

htop # Enhanced of top
sudo apt install htop  # install if not installed
htop

# Kill Terminal
Kill terminal by Process ID
ps aux | grep node         # Find the PID
kill 1234                 # Politely ask it to stop
kill -9 1234              # Force kill if it ignore normal kill

# killall – Terminate by name
killall node              # Kill all processes named 'node'

# Manage Background & Foreground Jobs
ping google.com &  # will sends continuous ICMP packets (pings) to Google's server to test network connectivity.

# Manage System Services – systemctl
Start, Stop, Restart, Enable:
sudo systemctl start nginx
sudo systemctl stop nginx
sudo systemctl restart nginx
sudo systemctl status nginx
sudo systemctl enable nginx     # Auto-start on boot


# ======================== Part 4: Networking Essentials (DevOps Starter Kit)

ping –> Check if a host is reachable
ping google.com  # sends packets to check network reachability
curl https://api.github.com   # talk to api, servers, url

netstat -tuln # netstat – View network connections (:older
ss -tuln # Modern more used - 
t = TCP, u = UDP, l = Listening, n = Numeric IPs

ufw – Simple Firewall Management

sudo ufw status             # View status
sudo ufw allow 22           # Allow SSH port
sudo ufw allow 80           # Allow HTTP
sudo ufw enable             # Turn firewall on

