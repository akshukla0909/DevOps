https://learn.microsoft.com/en-us/windows/wsl/install





# ==============================Part 1: File System And Navigation ===================================

# Essential Commands
pwd          # Show current location
cd /         # Go to root
cd ~         # Go to home directory
cd ..        # Go one level up
cd /var/log  # Go to log directory

# What is diff between root vs Home directory
root - This is the home directory of the root user (superuser), root user can access any user data
home - Other user data

# Listing files
ls                   # List files
ls -l                # Detailed list (permissions, size, owner)
ls -a                # Include hidden files
ls -lh               # Human-readable sizes

# Creating and Deleting
mkdir projects       # Make a directory
touch file.txt       # Create a blank file
rm file.txt          # Delete file
rm -r foldername     # Delete folder recursively - folder and it's file inside it

# How to write in a file
echo "Hello Akash!" > dummy-file.txt   # It will create a file and write a text on it, over ride if already exist
echo "Hello Akash!" >> dummy-file.txt  # Instead over write it will append

| Task                | Command Example                |
| ------------------- | ------------------------------ |
| Write one line      | `echo "Hello" > file.txt`      |
| Append a line       | `echo "More text" >> file.txt` |
| Type multiple lines | `cat > file.txt`               |
| Use a text editor   | `nano file.txt`                |
| View file contents  | `cat file.txt`                 |

# Quick Tips
